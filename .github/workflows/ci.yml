name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy
      - run: pytest --cov=timemachine --cov-report=term-missing --cov-report=xml
      - run: python -m build --no-isolation
      - run: python examples/demo.py
      - run: python -m venv /tmp/timemachine-wheel-check
      - run: /tmp/timemachine-wheel-check/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/timemachine-wheel-check/bin/timemachine --help
