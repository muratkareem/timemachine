name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples scripts
      - run: ruff format --check src tests examples scripts
      - run: mypy
      - run: pytest --cov=timemachine --cov-report=term-missing --cov-report=xml
      - run: python -m build --no-isolation
      - run: python examples/demo.py
      - run: python -m venv /tmp/timemachine-wheel-check
      - name: Install the packaged TUI in isolation
        run: |
          for wheel_path in dist/*.whl; do
            /tmp/timemachine-wheel-check/bin/pip install "${wheel_path}[tui]"
          done
      - run: cd /tmp && /tmp/timemachine-wheel-check/bin/timemachine --help
      - run: /tmp/timemachine-wheel-check/bin/python examples/demo.py
      - run: /tmp/timemachine-wheel-check/bin/python examples/tui_preview.py --output /tmp/timemachine-wheel-preview.svg
      - run: /tmp/timemachine-wheel-check/bin/python scripts/acceptance.py
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/release.txt twine
      - run: python scripts/build_release.py
      - run: twine check release-artifacts/*.whl release-artifacts/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: timemachine-release-candidate
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
