[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "timemachine-cli"
version = "0.1.0"
description = "Local filesystem checkpoints and safe undo for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Muhammedkarim Murat"}]
dependencies = ["typer>=0.16,<1", "rich>=13,<15"]

[project.optional-dependencies]
tui = ["textual>=6.12,<7"]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "hatchling>=1.26", "textual>=6.12,<7"]

[project.scripts]
timemachine = "timemachine.entrypoint:main"
tmachine = "timemachine.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/timemachine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/timemachine"]

[tool.ruff.lint.per-file-ignores]
"src/timemachine/cli.py" = ["B008"]

[project.urls]
Repository = "https://github.com/muratkareem/timemachine"
Documentation = "https://github.com/muratkareem/timemachine/tree/main/docs"
Issues = "https://github.com/muratkareem/timemachine/issues"
